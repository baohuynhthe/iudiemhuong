<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Đơn Giản Anh Yêu Em 🎵</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    /* Ảnh nền chân dung */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url("https://baohuynhthe.github.io/iudiemhuong/aiphi.jfif") center center no-repeat;
      background-size: contain; /* ✅ Giữ nguyên tỉ lệ ảnh dọc */
      background-position: center;
      background-color: #000; /* Thêm nền đen để tránh khoảng trống hai bên */
      z-index: 0;
      opacity: 0.9;
    }

    /* Ánh sáng lung linh */
    body::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.3) 0%, transparent 60%),
                  radial-gradient(circle at 80% 70%, rgba(255,255,255,0.2) 0%, transparent 60%);
      animation: shimmer 6s infinite alternate;
      z-index: 1;
    }

    @keyframes shimmer {
      0% {opacity: 0.6;}
      100% {opacity: 1;}
    }

    .card {
      position: relative;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(12px);
      padding: 30px 28px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      text-align: center;
      width: 90%;
      max-width: 380px;
      z-index: 2;
    }

    h2 {
      color: #ff0066;
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #333;
      margin-bottom: 20px;
    }

    #heartBtn {
      background: none;
      border: none;
      font-size: 50px;
      cursor: pointer;
      color: #ff4081;
      animation: pulse 1.2s infinite;
      z-index: 3;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    /* Hiệu ứng tim bay */
    .heart {
      position: fixed;
      bottom: 60px;
      font-size: 24px;
      color: #ff4b6e;
      animation: floatUp 2s ease-out forwards;
      opacity: 0.9;
      z-index: 3;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-180px) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎶 Đơn Giản Anh Yêu Em</h2>
    <p id="status">Trang đang phát nhạc (ban đầu không tiếng)...</p>
    <audio id="player" autoplay muted loop playsinline>
      <source src="dongiananhyeuem.mp3" type="audio/mpeg">
    </audio>
    <button id="heartBtn">💖</button>
  </div>

  <script>
    const player = document.getElementById("player");
    const status = document.getElementById("status");
    const heartBtn = document.getElementById("heartBtn");

    window.addEventListener("load", async () => {
      try {
        await player.play();
        status.textContent = "🎧 Nhạc đang phát (không tiếng)";
      } catch (err) {
        status.textContent = "Không thể tự phát, hãy chạm vào tim 💖";
      }
    });

    heartBtn.addEventListener("click", async () => {
      try {
        player.muted = false;
        await player.play();
        status.textContent = "🎵 Đang phát nhạc có tiếng!";
        heartBtn.disabled = true;

        // Tạo hiệu ứng tim bay lung linh
        for (let i = 0; i < 10; i++) {
          const heart = document.createElement("div");
          heart.classList.add("heart");
          heart.textContent = "💖";
          heart.style.left = Math.random() * window.innerWidth + "px";
          heart.style.animationDuration = (1.5 + Math.random() * 1.5) + "s";
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 2000);
        }
      } catch (err) {
        status.textContent = "Không thể bật tiếng (bị trình duyệt chặn)";
      }
    });
  </script>
</body>
</html>
