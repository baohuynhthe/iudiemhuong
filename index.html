<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chúc mừng 20/10 - Diễm Hương 💐</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #ffb6c1, #ffe4e1);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
    }

    img {
      width: 280px;
      height: 420px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
      margin-bottom: 20px;
    }

    h1 {
      color: #d63384;
      font-size: 1.8rem;
      font-weight: bold;
      opacity: 0;
      animation: moveUp 4s ease-out forwards;
    }

    @keyframes moveUp {
      0% {
        transform: translateY(100px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1.2rem;
      background-color: #ff69b4;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 105, 180, 0.4);
    }

    button:hover {
      background-color: #ff85c1;
    }
  </style>
</head>
<body>
  <img src="https://baohuynhthe.github.io/iudiemhuong/aiphi.jfif" alt="Ảnh của Diễm Hương">
  <h1 id="message">
    Chúc mừng ngày 20/10 💖<br>
    Gửi đến Diễm Hương xinh đẹp nhất trong tim anh!<br>
    Chúc em luôn rạng rỡ, hạnh phúc và được yêu thương mỗi ngày.<br>
    Anh yêu em rất nhiều 💐💞
  </h1>
  
  <button id="playBtn">Nhấn để phát nhạc 🎵</button>

  <audio id="music" src="https://archive.org/download/don-gian-anh-yeu-em-hoang-ton/Don%20Gian%20Anh%20Yeu%20Em%20-%20Hoang%20Ton.mp3"></audio>

  <script>
    const btn = document.getElementById('playBtn');
    const music = document.getElementById('music');
    const message = document.getElementById('message');

    btn.addEventListener('click', () => {
      music.play();
      btn.style.display = 'none';
      message.style.animation = "moveUp 4s ease-out forwards";
    });
  </script>
</body>
</html>
