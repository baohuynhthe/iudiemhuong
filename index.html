<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Phát nhạc từ QR</title>
  <style>
    body { font-family: Arial, sans-serif; display:flex; height:100vh; align-items:center; justify-content:center; margin:0; background:#f0f0f0; }
    .card { background:white; padding:24px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); text-align:center; max-width:400px; }
    button { margin:10px; padding:10px 20px; border:none; border-radius:8px; background:#007bff; color:white; font-size:16px; cursor:pointer; }
    button:hover { background:#0056b3; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎵 Nghe nhạc demo</h2>
    <p id="status">Đang sẵn sàng…</p>
    <audio id="player" preload="auto" controls>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
    <br />
    <button id="playBtn">▶️ Phát nhạc</button>
    <button id="pauseBtn">⏸ Dừng</button>
  </div>

  <script>
    const player = document.getElementById('player');
    const status = document.getElementById('status');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    player.play().then(() => {
      status.textContent = '🎶 Đang phát...';
    }).catch(() => {
      status.textContent = '👉 Chạm nút "Phát nhạc" để nghe';
    });

    playBtn.onclick = () => { player.play(); status.textContent = '🎶 Đang phát...'; };
    pauseBtn.onclick = () => { player.pause(); status.textContent = '⏸ Đã tạm dừng'; };
  </script>
</body>
</html>
